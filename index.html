<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ticaret Ürün Fotoğrafı Düzenleyici</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        input[type="file"] {
            margin: 20px 0;
        }
        #preview {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            display: none;
        }
        #loader {
            display: none;
            color: #ff6600; /* Trendyol turuncusu tarzı */
            font-weight: bold;
            margin: 15px 0;
            padding: 10px;
            background: #fff3e6;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ürün Fotoğrafı Yükle</h2>
        <p>Fotoğrafın arka planı otomatik silinip beyaz yapılacaktır.</p>
        
        <input type="file" id="imageInput" accept="image/*">
        
        <div id="loader">Yapay Zeka Modeli Yükleniyor... İlk yüklemede biraz sürebilir ⏳</div>
        
        <!-- Çıktı burada görünecek -->
        <img id="preview" src="" alt="Beyaz Arka Planlı Ürün">
    </div>

    <!-- Yapay Zeka Kütüphanesi -->
    <script type="module">
        import imglyRemoveBackground from "https://unpkg.com/@imgly/background-removal@1.4.3/dist/imgly-background-removal.esm.js";

        const fileInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const loader = document.getElementById('loader');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Yükleniyor animasyonunu aç
            loader.style.display = "block";
            preview.style.display = "none";

            try {
                // 1. Yapay zeka ile arka planı şeffaf yap
                const imageBlob = await imglyRemoveBackground(file);
                
                // 2. Çıkan şeffaf görseli oku
                const url = URL.createObjectURL(imageBlob);
                const img = new Image();
                img.src = url;

                img.onload = () => {
                    // 3. Orijinal fotoğraf boyutlarında bir Canvas (tuval) oluştur
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext("2d");

                    // 4. Tuvali tamamen beyaz renge boya
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // 5. Şeffaf ürün fotoğrafını beyaz tuvalin tam üstüne yerleştir
                    ctx.drawImage(img, 0, 0);

                    // 6. Sonucu JPG formatında ekrana yansıt
                    preview.src = canvas.toDataURL("image/jpeg", 0.95);
                    preview.style.display = "block";
                    loader.style.display = "none";
                };
            } catch (error) {
                console.error("İşlem hatası:", error);
                alert("Fotoğraf işlenirken bir sorun oluştu.");
                loader.style.display = "none";
            }
        });
    </script>
</body>
</html>
